version: "3.8"

services:
  # Base de données relationnelle PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: lakana_postgres
    restart: always
    environment:
      POSTGRES_USER: lakana_user
      POSTGRES_PASSWORD: lakana_password
      POSTGRES_DB: lakana_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakana_user -d lakana_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lakana_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://lakana_user:lakana_password@db:5432/lakana_db
      - SECRET_KEY=lakana_super_secret_dev_key_change_in_production_2026
      - SEUIL_DECLARATION_CENTIF=1000000.0
      - FENETRE_FRACTIONNEMENT_HEURES=48
      - BACKEND_CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  # Frontend Next.js
  frontend:
    image: node:20-alpine
    container_name: lakana_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend

volumes:
  postgres_data:
